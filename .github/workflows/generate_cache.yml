name: Update cache

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering


jobs:
  update_cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install python3-dev swig libssl-dev libfann-dev portaudio19-dev libpulse-dev python3-fann2
          python -m pip install build wheel uv
          python -m venv venv
          source venv/bin/activate
          uv pip install requests langcodes ovos-core[mycroft,lgpl,plugins,skills-essential,skills-extra,skills-audio,skills-gui,skills-internet,skills-media,skills-desktop,skills-ca,skills-pt,skills-en] --pre

      - name: Update intent_cache
        run: |
          source venv/bin/activate
          python gen_cache.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev || git checkout -b dev
          git add -A  # Track all changes, including new files
          git diff --staged --quiet || git commit -m "Update intent_cache"
          git push origin dev
